openapi: 3.1.0
info:
  title: Clever Cloud API — proposed Kubernetes CSI resources
  version: '2026-10-13'
  description: |-
    Proposed contract revision 2026-10-13. Neither the current clever-csi-driver nor the existing Axo backend implements this revision. The driver at baseline commit 339e7f0 implements the separate clever-csi-v1 action-based protocol. This document is an integration target, not a deployable compatibility claim; see axo-api.md for the implementation boundary and rollout prerequisites.
    Every resource lookup is byte-exact and scoped to the authenticated owner and cluster, using the authoritative Axo registry and the ceph-csi journal where applicable. GET, listing and resolve do not register aliases, adopt resources or trigger billing. Backend lookup failure is an error, never absence. Adoption occurs only during an authorized QEMU attachment, once and durably.
    Before rollout, inventory all existing volume handles, snapshot handles and node identities. This revision restricts resource handles to a path-safe ASCII alphabet; incompatible existing identities are never rewritten and never treated locally as absent. The driver must fail with FAILED_PRECONDITION and require operator intervention. Node identities are opaque tokens, not necessarily UUIDs; the HTTP frontend must preserve a correctly percent-encoded path segment byte-for-byte. If round-trip safety cannot be established, fail without reporting successful deletion.
    JSON fields are camelCase and CSI business enums are SCREAMING_SNAKE_CASE. The shared Axo error-context representation retains its existing snake_case discriminants and fields. Keys inside parameters and volumeContext retain their CSI spellings. JSON Schema maxLength counts Unicode characters, not UTF-8 bytes: x-maxUtf8Bytes documents additional byte limits enforced by server validation. Request fields, types and business enums are validated; unknown request fields are rejected. Responses may add fields. Feature names are forward-compatible strings; features enable operations, never alternative response shapes. New business enum values require a newer pinned Clever-API-Version.
    Mutations reconcile durable intent. Success means verified operation-specific postconditions, never merely accepted work; HTTP 202 is not emitted. A bounded Prefer wait either reaches completion or returns 409 operation-in-progress with Retry-After. Client timeout or disconnect does not cancel intent. Replays join the operation and inspect current state; no stale success is replayed. No Idempotency-Key header is used. Creation identity is the scoped CSI name; attachment identity is the immutable volume handle and exact node incarnation. Handles are never reassigned, including after delete and recreate under the same name.
    DELETE succeeds only with HTTP 200 and a validated outcome decided by the server after authoritative lookup. No HTTP 404, malformed identity or missing route is converted into successful deletion. Cross-cluster resources are indistinguishable from absent resources after authorization, but cluster absence is a distinct error. Resource deletion preserves dependent snapshots and clones and never implicitly detaches a mounted volume.
    Handler errors use HTTPErrorBody. Existing authentication and path-validation middleware may return the legacy cc-api or OVD forms documented below; clients fall back to the HTTP status. The machine-readable x-csi-error-codes catalogue defines this revision's handler codes and RPC-specific mappings. Success bodies must match the requested identity, shape, read-only policy and capacity; malformed or inconsistent success is DATA_LOSS. Unknown errors use the documented status fallback, never delete success.
    The driver must pin Clever-API-Version to its compiled contract date on every request. Human clients may omit it to select the newest revision. Dates are RFC 3339 UTC with up to nine fractional digits; timestamp nanoseconds must be preserved. Read operations admit the scoped driver Biscuit or organization OAuth1 through existing membership and admission checks, except capabilities and POST resolve, which are driver-only. Mutations are driver-only; this does not extend existing human write access to CSI resources.
    Request bodies are bounded by maxRequestBytes. Response pages are limited by both item count and serialized bytes, never more than 1 MiB. The proposed wait defaults of 30 seconds and maximum of 110 seconds require validation against the real HTTP frontend and all client deadlines before rollout. The client leaves transport slack inside both its HTTP and remaining gRPC deadline; it must not add slack after exceeding either budget.
servers:
- {url: 'https://api.clever-cloud.com'}
tags:
- name: Kubernetes
  description: Proposed cluster storage resources; not implemented by the current driver or backend.
x-contract-status: PROPOSED_NOT_IMPLEMENTED
x-current-driver-protocol: {name: clever-csi-v1, baselineCommit: 339e7f0}
paths:
  /v4/kubernetes/organisations/{ownerId}/clusters/{clusterId}/csi/capabilities:
    parameters:
    - {$ref: '#/components/parameters/OwnerId'}
    - {$ref: '#/components/parameters/ClusterId'}
    get:
      operationId: getKubernetesCsiCapabilities
      tags: [Kubernetes]
      summary: Read the selected contract and cached backend readiness
      description: 'Driver-only scoped read. Pin the contract date even here. ready=false is HTTP 200
        with reasons; too-old contract, missing core feature or missing LEGACY_POOL_ROUTING in a mixed
        pool makes the driver unready. Ignore unknown feature strings. Health observations are at most
        ten seconds old and the response is Cache-Control: no-store.'
      security:
      - {biscuit: []}
      parameters:
      - {$ref: '#/components/parameters/ApiVersion'}
      - {$ref: '#/components/parameters/RequestId'}
      x-csi-error-codes: [clever.kubernetes.invalid-request, clever.kubernetes.cluster-not-found, clever.kubernetes.request-too-large,
        clever.kubernetes.rate-limited, clever.kubernetes.backend-unavailable, clever.kubernetes.upstream-timeout]
      responses:
        '200':
          description: Verified success; see operation postconditions.
          headers:
            Clever-API-Version: {$ref: '#/components/headers/ApiVersion'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control:
              description: Readiness changes must not be hidden by HTTP caching.
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KubernetesCsiCapabilities'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
        '404': {$ref: '#/components/responses/HandlerError'}
        '413': {$ref: '#/components/responses/HandlerError'}
        '429': {$ref: '#/components/responses/HandlerError'}
        '503': {$ref: '#/components/responses/HandlerError'}
        '504': {$ref: '#/components/responses/HandlerError'}
        default: {$ref: '#/components/responses/HandlerError'}
  /v4/kubernetes/organisations/{ownerId}/clusters/{clusterId}/csi/volumes:
    parameters:
    - {$ref: '#/components/parameters/OwnerId'}
    - {$ref: '#/components/parameters/ClusterId'}
    get:
      operationId: listKubernetesVolumes
      tags: [Kubernetes]
      summary: List observed volumes without adoption
      description: Read the scoped registry and compatible legacy journal entries without creating aliases
        or billing. No matches is an empty page; inaccessible dependencies are errors. Pagination is bounded
        by count and bytes.
      security:
      - {biscuit: []}
      - {oauth1: []}
      parameters:
      - {$ref: '#/components/parameters/ApiVersion'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      - name: name
        in: query
        schema: {$ref: '#/components/schemas/KubernetesCsiName'}
        description: Exact live creation name filter.
      x-csi-error-codes: [clever.kubernetes.invalid-request, clever.kubernetes.cluster-not-found, clever.kubernetes.request-too-large,
        clever.kubernetes.rate-limited, clever.kubernetes.backend-unavailable, clever.kubernetes.upstream-timeout,
        clever.kubernetes.invalid-cursor, clever.kubernetes.unsupported-capability]
      responses:
        '200':
          description: Verified success; see operation postconditions.
          headers:
            Clever-API-Version: {$ref: '#/components/headers/ApiVersion'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KubernetesVolumePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
        '404': {$ref: '#/components/responses/HandlerError'}
        '413': {$ref: '#/components/responses/HandlerError'}
        '429': {$ref: '#/components/responses/HandlerError'}
        '501': {$ref: '#/components/responses/HandlerError'}
        '503': {$ref: '#/components/responses/HandlerError'}
        '504': {$ref: '#/components/responses/HandlerError'}
        default: {$ref: '#/components/responses/HandlerError'}
      x-required-feature: VOLUME_LIST
    post:
      operationId: ensureKubernetesVolume
      tags: [Kubernetes]
      summary: Ensure a volume, clone or restore by scoped CSI name
      description: 'Ensure-by-name: 201 when this operation creates the initialized resource, 200 for
        a compatible existing resource or joined replay. Validate range, immutable source, policy and
        shape before mutation. An incompatible terminal existing resource is incompatible-resource. An
        in-flight operation is joined for a compatible replay; conflicting work returns operation-in-progress.
        Creating a resource after an older handle was deleted allocates a new never-reused handle. Clone/restore
        require their optional features. Unsupported encryption/RWX is rejected. Only Axo initializes
        the filesystem; the guest never formats.'
      security:
      - {biscuit: []}
      parameters:
      - {$ref: '#/components/parameters/ApiVersion'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/PreferWait'}
      x-csi-error-codes: [clever.kubernetes.invalid-request, clever.kubernetes.cluster-not-found, clever.kubernetes.request-too-large,
        clever.kubernetes.rate-limited, clever.kubernetes.backend-unavailable, clever.kubernetes.upstream-timeout,
        clever.kubernetes.forbidden-parameter, clever.kubernetes.incompatible-source, clever.kubernetes.capacity-out-of-range,
        clever.kubernetes.volume-not-found, clever.kubernetes.snapshot-not-found, clever.kubernetes.incompatible-resource,
        clever.kubernetes.operation-in-progress, clever.kubernetes.storage-quota-exceeded, clever.kubernetes.unsupported-capability]
      responses:
        '200':
          description: Verified success; see operation postconditions.
          headers:
            Clever-API-Version: {$ref: '#/components/headers/ApiVersion'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Preference-Applied: {$ref: '#/components/headers/PreferenceApplied'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KubernetesReadyVolume'}
        '201':
          description: Created resource or new observed attachment; completed postconditions match HTTP
            200.
          headers:
            Clever-API-Version: {$ref: '#/components/headers/ApiVersion'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Preference-Applied: {$ref: '#/components/headers/PreferenceApplied'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KubernetesReadyVolume'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
        '404': {$ref: '#/components/responses/HandlerError'}
        '409': {$ref: '#/components/responses/HandlerError'}
        '412': {$ref: '#/components/responses/HandlerError'}
        '413': {$ref: '#/components/responses/HandlerError'}
        '429': {$ref: '#/components/responses/HandlerError'}
        '501': {$ref: '#/components/responses/HandlerError'}
        '503': {$ref: '#/components/responses/HandlerError'}
        '504': {$ref: '#/components/responses/HandlerError'}
        default: {$ref: '#/components/responses/HandlerError'}
      x-required-feature: VOLUME_ENSURE
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KubernetesVolumeEnsure'}
  /v4/kubernetes/organisations/{ownerId}/clusters/{clusterId}/csi/volumes/{volumeId}:
    parameters:
    - {$ref: '#/components/parameters/OwnerId'}
    - {$ref: '#/components/parameters/ClusterId'}
    - {$ref: '#/components/parameters/VolumeId'}
    get:
      operationId: getKubernetesVolume
      tags: [Kubernetes]
      summary: Read an observed volume by immutable handle
      description: Pure authoritative lookup through registry and legacy journal. No alias insertion,
        adoption or billing. A foreign resource is indistinguishable from absence; a failed lookup is
        backend-unavailable.
      security:
      - {biscuit: []}
      - {oauth1: []}
      parameters:
      - {$ref: '#/components/parameters/ApiVersion'}
      - {$ref: '#/components/parameters/RequestId'}
      x-csi-error-codes: [clever.kubernetes.invalid-request, clever.kubernetes.cluster-not-found, clever.kubernetes.request-too-large,
        clever.kubernetes.rate-limited, clever.kubernetes.backend-unavailable, clever.kubernetes.upstream-timeout,
        clever.kubernetes.volume-not-found]
      responses:
        '200':
          description: Verified success; see operation postconditions.
          headers:
            Clever-API-Version: {$ref: '#/components/headers/ApiVersion'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KubernetesVolume'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
        '404': {$ref: '#/components/responses/HandlerError'}
        '413': {$ref: '#/components/responses/HandlerError'}
        '429': {$ref: '#/components/responses/HandlerError'}
        '503': {$ref: '#/components/responses/HandlerError'}
        '504': {$ref: '#/components/responses/HandlerError'}
        default: {$ref: '#/components/responses/HandlerError'}
      x-required-feature: VOLUME_RESOLVE
    delete:
      operationId: deleteKubernetesVolume
      tags: [Kubernetes]
      summary: Delete a detached volume with an authoritative outcome
      description: Only HTTP 200 with resourceId equal to volumeId, nodeId null and detachedNodeIds empty
        is success. DELETED means the CSI identity is gone and no longer listed; deferred backend purge
        must not break retained snapshots/clones. ALREADY_ABSENT requires authoritative scoped registry
        and legacy-journal absence. Never detach implicitly. A retained attachment or pending claim returns
        volume-in-use. No 404 or invalid handle is converted to success.
      security:
      - {biscuit: []}
      parameters:
      - {$ref: '#/components/parameters/ApiVersion'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/PreferWait'}
      x-csi-error-codes: [clever.kubernetes.invalid-request, clever.kubernetes.cluster-not-found, clever.kubernetes.request-too-large,
        clever.kubernetes.rate-limited, clever.kubernetes.backend-unavailable, clever.kubernetes.upstream-timeout,
        clever.kubernetes.operation-in-progress, clever.kubernetes.volume-in-use]
      responses:
        '200':
          description: Verified success; see operation postconditions.
          headers:
            Clever-API-Version: {$ref: '#/components/headers/ApiVersion'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Preference-Applied: {$ref: '#/components/headers/PreferenceApplied'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KubernetesResourceDeleteOutcome'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
        '404': {$ref: '#/components/responses/HandlerError'}
        '409': {$ref: '#/components/responses/HandlerError'}
        '413': {$ref: '#/components/responses/HandlerError'}
        '429': {$ref: '#/components/responses/HandlerError'}
        '503': {$ref: '#/components/responses/HandlerError'}
        '504': {$ref: '#/components/responses/HandlerError'}
        default: {$ref: '#/components/responses/HandlerError'}
      x-required-feature: VOLUME_DELETE
  /v4/kubernetes/organisations/{ownerId}/clusters/{clusterId}/csi/volumes/{volumeId}/resolve:
    parameters:
    - {$ref: '#/components/parameters/OwnerId'}
    - {$ref: '#/components/parameters/ClusterId'}
    - {$ref: '#/components/parameters/VolumeId'}
    post:
      operationId: resolveKubernetesVolume
      tags: [Kubernetes]
      summary: Verify observed shape and untrusted CSI hints without mutation
      description: Driver-only read with a body. Resolve through registry and legacy journal on every
        route; this call is not a prerequisite for attachment and does not insert an alias or adopt. Return
        observed shape whenever verifiable, including differences from expectedShape. A positively established
        incompatibility may return 412 shape-mismatch, which ValidateVolumeCapabilities maps to OK with
        confirmed absent. Unknown/unreadable backend state remains an error, never unconfirmed success.
      security:
      - {biscuit: []}
      parameters:
      - {$ref: '#/components/parameters/ApiVersion'}
      - {$ref: '#/components/parameters/RequestId'}
      x-csi-error-codes: [clever.kubernetes.invalid-request, clever.kubernetes.cluster-not-found, clever.kubernetes.request-too-large,
        clever.kubernetes.rate-limited, clever.kubernetes.backend-unavailable, clever.kubernetes.upstream-timeout,
        clever.kubernetes.forbidden-parameter, clever.kubernetes.volume-not-found, clever.kubernetes.shape-mismatch]
      responses:
        '200':
          description: Verified success; see operation postconditions.
          headers:
            Clever-API-Version: {$ref: '#/components/headers/ApiVersion'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KubernetesVolume'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
        '404': {$ref: '#/components/responses/HandlerError'}
        '412': {$ref: '#/components/responses/HandlerError'}
        '413': {$ref: '#/components/responses/HandlerError'}
        '429': {$ref: '#/components/responses/HandlerError'}
        '503': {$ref: '#/components/responses/HandlerError'}
        '504': {$ref: '#/components/responses/HandlerError'}
        default: {$ref: '#/components/responses/HandlerError'}
      x-required-feature: VOLUME_RESOLVE
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KubernetesVolumeResolve'}
  /v4/kubernetes/organisations/{ownerId}/clusters/{clusterId}/csi/volumes/{volumeId}/expand:
    parameters:
    - {$ref: '#/components/parameters/OwnerId'}
    - {$ref: '#/components/parameters/ClusterId'}
    - {$ref: '#/components/parameters/VolumeId'}
    post:
      operationId: expandKubernetesVolume
      tags: [Kubernetes]
      summary: Expand an image and verify its observable capacity
      description: No shrink. Verify supplied expectedShape before any mutation; 412 shape-mismatch maps
        to ControllerExpandVolume INVALID_ARGUMENT. Observe image and QEMU device capacity after expansion;
        do not return success for an enqueued resize. Respect mounted/offline filesystem responsibilities
        stated in KubernetesVolumeExpand. Attached volumes are not rejected solely for being attached
        when safe online expansion is available.
      security:
      - {biscuit: []}
      parameters:
      - {$ref: '#/components/parameters/ApiVersion'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/PreferWait'}
      x-csi-error-codes: [clever.kubernetes.invalid-request, clever.kubernetes.cluster-not-found, clever.kubernetes.request-too-large,
        clever.kubernetes.rate-limited, clever.kubernetes.backend-unavailable, clever.kubernetes.upstream-timeout,
        clever.kubernetes.capacity-out-of-range, clever.kubernetes.volume-not-found, clever.kubernetes.operation-in-progress,
        clever.kubernetes.legacy-session-present, clever.kubernetes.shape-mismatch, clever.kubernetes.storage-quota-exceeded,
        clever.kubernetes.hypervisor-unreachable, clever.kubernetes.unsupported-capability]
      responses:
        '200':
          description: Verified success; see operation postconditions.
          headers:
            Clever-API-Version: {$ref: '#/components/headers/ApiVersion'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Preference-Applied: {$ref: '#/components/headers/PreferenceApplied'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KubernetesReadyVolume'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
        '404': {$ref: '#/components/responses/HandlerError'}
        '409': {$ref: '#/components/responses/HandlerError'}
        '412': {$ref: '#/components/responses/HandlerError'}
        '413': {$ref: '#/components/responses/HandlerError'}
        '429': {$ref: '#/components/responses/HandlerError'}
        '501': {$ref: '#/components/responses/HandlerError'}
        '503': {$ref: '#/components/responses/HandlerError'}
        '504': {$ref: '#/components/responses/HandlerError'}
        default: {$ref: '#/components/responses/HandlerError'}
      x-required-feature: VOLUME_EXPAND
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KubernetesVolumeExpand'}
  /v4/kubernetes/organisations/{ownerId}/clusters/{clusterId}/csi/volumes/{volumeId}/attachments:
    parameters:
    - {$ref: '#/components/parameters/OwnerId'}
    - {$ref: '#/components/parameters/ClusterId'}
    - {$ref: '#/components/parameters/VolumeId'}
    get:
      operationId: listKubernetesVolumeAttachments
      tags: [Kubernetes]
      summary: List attachment observations for a volume
      description: Read-only listing of current scoped attachment records, including unresolved lifecycle
        states; no QMP instruction or adoption is performed.
      security:
      - {biscuit: []}
      - {oauth1: []}
      parameters:
      - {$ref: '#/components/parameters/ApiVersion'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      x-csi-error-codes: [clever.kubernetes.invalid-request, clever.kubernetes.cluster-not-found, clever.kubernetes.request-too-large,
        clever.kubernetes.rate-limited, clever.kubernetes.backend-unavailable, clever.kubernetes.upstream-timeout,
        clever.kubernetes.invalid-cursor, clever.kubernetes.volume-not-found, clever.kubernetes.unsupported-capability]
      responses:
        '200':
          description: Verified success; see operation postconditions.
          headers:
            Clever-API-Version: {$ref: '#/components/headers/ApiVersion'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KubernetesVolumeAttachmentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
        '404': {$ref: '#/components/responses/HandlerError'}
        '413': {$ref: '#/components/responses/HandlerError'}
        '429': {$ref: '#/components/responses/HandlerError'}
        '501': {$ref: '#/components/responses/HandlerError'}
        '503': {$ref: '#/components/responses/HandlerError'}
        '504': {$ref: '#/components/responses/HandlerError'}
        default: {$ref: '#/components/responses/HandlerError'}
      x-required-feature: ATTACHMENT_LIST
    post:
      operationId: ensureKubernetesVolumeAttachment
      tags: [Kubernetes]
      summary: Ensure a fenced QEMU attachment or verified legacy route
      description: 'Identity is (volumeId,nodeId). 201 is a new observed attachment, 200 an existing compatible
        observation. Do not change another live owner. A new QEMU target must be the exact current VM
        incarnation; historical Node names route only through the legacy registry. Before QEMU adoption,
        prove legacy release, fence prior ownership, then observe the device and readonly state. generation
        and serial survive reboot/migration of the same incarnation. A new fencing epoch is not permission
        to rotate the serial. Read-only raw Block additionally requires the guest kernel read-only flag;
        an ro bind mount is insufficient. An attachment request never evicts a valid live writer: return
        attached-elsewhere. Fencing addresses superseded work or an incarnation authoritatively retired
        by the platform, not destruction of an active owner to satisfy the request. LEGACY_KRBD is available
        only for a verified unadopted legacy image without live/pending QEMU ownership or a fence forbidding
        return to legacy access.'
      security:
      - {biscuit: []}
      parameters:
      - {$ref: '#/components/parameters/ApiVersion'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/PreferWait'}
      x-csi-error-codes: [clever.kubernetes.invalid-request, clever.kubernetes.cluster-not-found, clever.kubernetes.request-too-large,
        clever.kubernetes.rate-limited, clever.kubernetes.backend-unavailable, clever.kubernetes.upstream-timeout,
        clever.kubernetes.forbidden-parameter, clever.kubernetes.volume-not-found, clever.kubernetes.node-not-found,
        clever.kubernetes.incompatible-resource, clever.kubernetes.operation-in-progress, clever.kubernetes.attached-elsewhere,
        clever.kubernetes.attachment-conflict, clever.kubernetes.incarnation-unknown, clever.kubernetes.shape-mismatch,
        clever.kubernetes.node-not-attachable, clever.kubernetes.fencing-required, clever.kubernetes.legacy-path-not-released,
        clever.kubernetes.attachment-limit, clever.kubernetes.hypervisor-unreachable, clever.kubernetes.unsupported-capability]
      responses:
        '200':
          description: Verified success; see operation postconditions.
          headers:
            Clever-API-Version: {$ref: '#/components/headers/ApiVersion'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Preference-Applied: {$ref: '#/components/headers/PreferenceApplied'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KubernetesReadyAttachment'}
        '201':
          description: Created resource or new observed attachment; completed postconditions match HTTP
            200.
          headers:
            Clever-API-Version: {$ref: '#/components/headers/ApiVersion'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Preference-Applied: {$ref: '#/components/headers/PreferenceApplied'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KubernetesReadyAttachment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthError'}
        '403': {$ref: '#/components/responses/AuthError'}
        '404': {$ref: '#/components/responses/HandlerError'}
        '409': {$ref: '#/components/responses/HandlerError'}
        '412': {$ref: '#/components/responses/HandlerError'}
        '413': {$ref: '#/components/responses/HandlerError'}
        '429': {$ref: '#/components/responses/HandlerError'}
        '501': {$ref: '#/components/responses/HandlerError'}
        '503': {$ref: '#/components/responses/HandlerError'}
        '504': {$ref: '#/components/responses/HandlerError'}
        default: {$ref: '#/components/responses/HandlerError'}
      x-required-feature: ATTACHMENT_ENSURE
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KubernetesVolumeAttachmentEnsure'}
    delete:
      operationId: deleteKubernetesVolumeAttachments
      tags: [Kubernetes]
      summary: Complete detach across every applicable incarnation
      description: Detach-all is a distinct resource path, not a sentinel node id. resourceId must equal
        volumeId and nodeId must be null. Check every recorded QEMU or legacy target. Return DETACHED

{{- if .Values.node.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.controller.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi.labels" . | nindent 4 }}
{{- end }}
